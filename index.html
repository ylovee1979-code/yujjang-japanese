<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7f4">
<title>유짱의 매일일본어</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
:root{
 --ink:#333238;
 --muted:#817672;
 --rose:#b95467;
 --pink:#fff0f3;
 --blue:#edf7fc;
 --mint:#eff8eb;
 --yellow:#fff7dc;
 --lav:#f3efff;
 --line:#eee4de;
 --shadow:0 12px 30px rgba(78,57,48,.08);
}
*{box-sizing:border-box}
body{
 margin:0;
 background:linear-gradient(#fffaf7,#fff);
 color:var(--ink);
 font-family:'Gowun Dodum',sans-serif;
}
button,input{font-family:inherit}
button{cursor:pointer}

.lock{
 position:fixed;
 inset:0;
 z-index:999;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px;
 background:linear-gradient(145deg,#fffaf7,#fff0f4,#eef8ff);
}
.lockbox{
 max-width:410px;
 width:100%;
 background:#fff;
 border:1px solid var(--line);
 border-radius:28px;
 padding:28px;
 text-align:center;
 box-shadow:var(--shadow);
}
.flower{font-size:48px}
.lockbox h2{color:#9f4355;margin:8px 0}
.lockbox p{color:var(--muted)}
.lockbox input{
 width:100%;
 padding:16px;
 border:1px solid #ead9d4;
 border-radius:15px;
 text-align:center;
 font-size:22px;
 letter-spacing:7px;
}
.lockbox button{
 width:100%;
 margin-top:12px;
 padding:14px;
 border:0;
 border-radius:15px;
 background:var(--rose);
 color:#fff;
 font-weight:700;
}

.app{
 max-width:720px;
 margin:auto;
 padding-bottom:30px;
}
.hero{
 margin:0 14px 10px;
 padding:28px 22px;
 border-radius:0 0 34px 34px;
 background:
 radial-gradient(circle at 88% 17%,#ffd3dc 0 58px,transparent 59px),
 linear-gradient(135deg,#fffaf5,#fff0f4 58%,#eff8ff);
 box-shadow:var(--shadow);
}
.hero small{color:#a85d6b;font-weight:700}
.hero h1{font-size:31px;margin:8px 0}
.hero h1 span{
 background:#f6cbd3;
 padding:4px 10px;
 border-radius:14px;
}
.hero p{color:#776c68;margin:0}
.badge{
 display:inline-block;
 margin-top:13px;
 background:#fff7d8;
 padding:8px 12px;
 border-radius:12px;
 font-size:13px;
}

.tabs{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
 padding:10px 14px;
 position:sticky;
 top:0;
 z-index:10;
 background:rgba(255,255,255,.94);
 backdrop-filter:blur(8px);
}
.tabs button{
 border:0;
 padding:12px 5px;
 border-radius:14px;
 font-weight:700;
 color:#746965;
}
.tabs button:nth-child(1){background:var(--pink)}
.tabs button:nth-child(2){background:var(--blue)}
.tabs button:nth-child(3){background:var(--mint)}
.tabs button:nth-child(4){background:var(--lav)}
.tabs .on{
 outline:2px solid #c97686;
 color:#96394b;
}

main{padding:0 14px 18px}
.hide{display:none}
.card{
 margin:12px 0;
 padding:18px;
 background:#fff;
 border:1px solid var(--line);
 border-radius:24px;
 box-shadow:var(--shadow);
}
.row{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px;
}
.tag{
 background:var(--pink);
 color:#a14354;
 padding:6px 10px;
 border-radius:99px;
 font-size:12px;
 font-weight:700;
}
.star{
 border:0;
 background:transparent;
 font-size:27px;
 color:#bc6878;
}
.word{
 font-family:'Noto Sans JP',sans-serif;
 font-size:47px;
 font-weight:900;
 text-align:center;
 color:#a74457;
 margin:18px 0 3px;
}
.reading{
 font-family:'Noto Sans JP',sans-serif;
 font-size:20px;
 text-align:center;
 color:#6e6470;
}
.meaning{
 font-size:25px;
 font-weight:700;
 text-align:center;
 margin:18px 0;
}
.speak{
 border:0;
 background:#fff1e2;
 color:#885920;
 border-radius:99px;
 padding:10px 14px;
 font-weight:700;
}
.btn{
 border:0;
 border-radius:15px;
 padding:14px;
 font-weight:700;
}
.full{
 width:100%;
 background:#f3b8c3;
 color:#773643;
}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:9px;
}
.again{
 background:#f8edf0;
 color:#92515e;
}
.know{
 background:var(--rose);
 color:#fff;
}
.progress{
 height:10px;
 background:#f0eae7;
 border-radius:99px;
 overflow:hidden;
 margin-top:9px;
}
.bar{
 height:100%;
 background:linear-gradient(90deg,#e390a1,#b95467);
 width:0;
}
.hint{
 font-size:12px;
 color:#948782;
 margin-top:7px;
}
.quote{
 padding:15px;
 text-align:center;
 background:var(--yellow);
 border-radius:18px;
 line-height:1.8;
}
.search{
 width:100%;
 padding:13px;
 border:1px solid #e7ddd8;
 border-radius:14px;
 background:#fffdfa;
 margin-bottom:8px;
}
.listitem{
 padding:13px 2px;
 border-bottom:1px dashed #eee4df;
}
.jp{
 font-family:'Noto Sans JP',sans-serif;
 font-size:20px;
 font-weight:700;
 color:#9f4355;
}
.kr{
 font-size:13px;
 color:#766c68;
}
.quizopt{
 width:100%;
 text-align:left;
 padding:13px;
 border:1px solid #e7ddd8;
 background:#fffdfa;
 border-radius:13px;
 margin:6px 0;
}
.correct{background:#e4f6e7!important}
.wrong{background:#ffe4e9!important}
.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.stat{
 padding:16px 6px;
 border-radius:17px;
 text-align:center;
}
.stat:nth-child(1){background:var(--pink)}
.stat:nth-child(2){background:var(--blue)}
.stat:nth-child(3){background:var(--mint)}
.num{
 font-size:26px;
 font-weight:700;
 margin-top:4px;
}
.footer{
 text-align:center;
 color:#9a8e89;
 font-size:12px;
 padding:8px 20px 24px;
}
</style>
</head>

<body>

<div class="lock" id="lock">
 <div class="lockbox">
  <div class="flower">🌸</div>
  <h2>유짱의 매일일본어</h2>
  <p>비밀번호를 입력하면 학습을 시작할 수 있어요.</p>
  <input id="passcode" type="password" inputmode="numeric"
         maxlength="4" placeholder="••••">
  <button onclick="unlockApp()">입장하기</button>
  <div id="lockmsg" style="color:#b63f51;margin-top:9px;min-height:20px"></div>
 </div>
</div>

<div class="app">

<section class="hero">
 <small>一日日本語 · JLPT N4</small>
 <h1>유짱의 <span>매일일본어</span> 🌸</h1>
 <p>오늘도 조금씩, 일본어가 좋아지는 하루.</p>
 <div class="badge">☀️ 하루 한 단어라도 꾸준히</div>
</section>

<div class="tabs">
 <button class="on" onclick="tab('study',this)">학습</button>
 <button onclick="tab('quiz',this)">퀴즈</button>
 <button onclick="tab('words',this)">단어장</button>
 <button onclick="tab('progress',this)">진도</button>
</div>

<main id="study">

 <div class="card">
  <div class="row">
   <span class="tag" id="cat"></span>
   <button class="star" id="starBtn" onclick="toggleFav()">☆</button>
  </div>

  <div class="word" id="w"></div>
  <div class="reading" id="r"></div>

  <div style="text-align:center;margin-top:12px">
   <button class="speak" onclick="speakWord()">🔊 발음 듣기</button>
  </div>

  <div class="meaning" id="m" style="visibility:hidden"></div>

  <button class="btn full" onclick="showMeaning()">뜻 보기</button>

  <div class="actions">
   <button class="btn again" onclick="mark(false)">다시 볼래</button>
   <button class="btn know" onclick="mark(true)">외웠어요 ✓</button>
  </div>
 </div>

 <div class="card">
  <div class="row">
   <b>학습 진도</b>
   <span id="progText"></span>
  </div>
  <div class="progress">
   <div class="bar" id="bar"></div>
  </div>
  <div class="hint">학습 기록은 이 브라우저에 자동 저장돼요.</div>
 </div>

 <div class="quote">
 「好き」からはじまる、わたしの日本語。<br>
 좋아하는 마음에서 시작하는 나의 일본어.
 </div>

</main>

<main id="quiz" class="hide">
 <div class="card">
  <small>4지선다 퀴즈</small>
  <div class="word" id="qw"></div>
  <div class="reading" id="qr"></div>
  <div style="text-align:center;margin:10px">
   <button class="speak" onclick="speakQuiz()">🔊 발음 듣기</button>
  </div>
  <div id="opts"></div>
  <div id="qmsg" style="font-weight:700;margin:9px 0"></div>
  <button class="btn full" onclick="newQuiz()">다음 문제</button>
 </div>
</main>

<main id="words" class="hide">
 <div class="card">
  <input id="search" class="search"
         placeholder="단어 · 읽기 · 뜻 검색"
         oninput="renderList()">
  <div id="list"></div>
 </div>
</main>

<main id="progress" class="hide">

 <div class="card">
  <div class="stats">
   <div class="stat">
    암기
    <div class="num" id="knownN">0</div>
   </div>
   <div class="stat">
    다시
    <div class="num" id="againN">0</div>
   </div>
   <div class="stat">
    즐겨찾기
    <div class="num" id="favN">0</div>
   </div>
  </div>
 </div>

 <div class="card">
  <b>전체 암기율</b>
  <div class="progress">
   <div class="bar" id="totalBar"></div>
  </div>
  <div id="totalText" class="hint"></div>
 </div>

</main>

<div class="footer">
 🐈 🌸<br>
 매일 조금씩, 꾸준히.<br>
 유짱의 매일일본어
</div>

</div>

["面白い","おもしろい","재미있다","형용사"],

["待つ","まつ","기다리다","동사"],
["見る","みる","보다","동사"],
["難しい","むずかしい","어렵다","형용사"],

["山","やま","산","명사"],
["有名","ゆうめい","유명하다","형용동사"],
["読む","よむ","읽다","동사"],
["旅行","りょこう","여행","명사"],
["練習","れんしゅう","연습","명사"],
["分かる","わかる","알다, 이해하다","동사"],
["忘れる","わすれる","잊다","동사"]
];

const $=id=>document.getElementById(id);

let state=JSON.parse(
 localStorage.getItem("yujjangN4") ||
 '{"known":{},"again":{},"fav":{}}'
);

let idx=Number(localStorage.getItem("yujjangIndex")||0);
let quizWord=null;

function unlockApp(){
 if($("passcode").value==="1234"){
  sessionStorage.setItem("yujjang_access","ok");
  $("lock").style.display="none";
 }else{
  $("lockmsg").textContent="비밀번호가 맞지 않아요.";
  $("passcode").value="";
 }
}

$("passcode").addEventListener("keydown",e=>{
 if(e.key==="Enter") unlockApp();
});

if(sessionStorage.getItem("yujjang_access")==="ok"){
 $("lock").style.display="none";
}

function save(){
 localStorage.setItem("yujjangN4",JSON.stringify(state));
 localStorage.setItem("yujjangIndex",idx);
}

function tab(id,button){
 document.querySelectorAll("main").forEach(x=>x.classList.add("hide"));
 $(id).classList.remove("hide");

 document.querySelectorAll(".tabs button")
 .forEach(x=>x.classList.remove("on"));

 button.classList.add("on");

 if(id==="quiz") newQuiz();
 if(id==="words") renderList();
 if(id==="progress") renderProgress();
}

function render(){
 const x=WORDS[idx];

 $("w").textContent=x[0];
 $("r").textContent=x[1];
 $("m").textContent=x[2];
 $("cat").textContent=x[3];

 $("m").style.visibility="hidden";

 $("starBtn").textContent=
 state.fav[idx] ? "★" : "☆";

 updateProgress();
}

function showMeaning(){
 $("m").style.visibility="visible";
}

function mark(ok){
 if(ok){
  state.known[idx]=true;
  delete state.again[idx];
 }else{
  state.again[idx]=true;
  delete state.known[idx];
 }

 idx=(idx+1)%WORDS.length;
 save();
 render();
}

function toggleFav(){
 if(state.fav[idx]) delete state.fav[idx];
 else state.fav[idx]=true;

 save();
 render();
}

function updateProgress(){
 const done=
 Object.keys(state.known).length+
 Object.keys(state.again).length;

 $("progText").textContent=
 done+" / "+WORDS.length;

 $("bar").style.width=
 (done/WORDS.length*100)+"%";
}

function renderList(){

 const q=$("search").value.trim().toLowerCase();

 $("list").innerHTML="";

 WORDS.forEach((x,i)=>{

  if(q && !x.join(" ").toLowerCase().includes(q)) return;

  const item=document.createElement("div");
  item.className="listitem";

  item.innerHTML=`
   <div class="row">
    <div>
     <div class="jp">
      ${x[0]}
      <span class="hint">${x[1]}</span>
     </div>
     <div class="kr">${x[2]} · ${x[3]}</div>
    </div>
    <button class="star">
     ${state.fav[i] ? "★" : "☆"}
    </button>
   </div>
  `;

  item.querySelector("button").onclick=e=>{
   e.stopPropagation();

   if(state.fav[i]) delete state.fav[i];
   else state.fav[i]=true;

   save();
   renderList();
  };

  item.onclick=()=>{
   idx=i;
   save();

   document.querySelector(".tabs button").click();
   render();
  };

  $("list").appendChild(item);
 });
}

function renderProgress(){

 const known=Object.keys(state.known).length;
 const again=Object.keys(state.again).length;
 const fav=Object.keys(state.fav).length;

 $("knownN").textContent=known;
 $("againN").textContent=again;
 $("favN").textContent=fav;

 const percent=known/WORDS.length*100;

 $("totalBar").style.width=percent+"%";

 $("totalText").textContent=
 WORDS.length+"개 중 "+
 known+"개 암기 · "+
 Math.round(percent)+"%";
}

function newQuiz(){

 $("qmsg").textContent="";

 const qi=Math.floor(Math.random()*WORDS.length);

 quizWord=WORDS[qi];

 $("qw").textContent=quizWord[0];
 $("qr").textContent=quizWord[1];

 let answers=[quizWord[2]];

 while(answers.length<4){

  const random=
  WORDS[Math.floor(Math.random()*WORDS.length)][2];

  if(!answers.includes(random))
   answers.push(random);
 }

 answers.sort(()=>Math.random()-.5);

 $("opts").innerHTML="";

 answers.forEach(answer=>{

  const b=document.createElement("button");

  b.className="quizopt";
  b.textContent=answer;

  b.onclick=()=>{

   document.querySelectorAll(".quizopt")
   .forEach(x=>x.disabled=true);

   if(answer===quizWord[2]){

    b.classList.add("correct");
    $("qmsg").textContent="정답! 🎉";

   }else{

    b.classList.add("wrong");

    $("qmsg").textContent=
    "정답: "+quizWord[2];

    [...document.querySelectorAll(".quizopt")]
    .find(x=>x.textContent===quizWord[2])
    ?.classList.add("correct");
   }
  };

  $("opts").appendChild(b);
 });
}

let voices=[];

function loadVoices(){
 voices=speechSynthesis.getVoices();
}

if("speechSynthesis" in window){
 loadVoices();
 speechSynthesis.onvoiceschanged=loadVoices;
}

function speakText(text){

 if(!("speechSynthesis" in window)){
  alert("이 기기에서는 음성 재생을 지원하지 않아요.");
  return;
 }

 speechSynthesis.cancel();

 const utterance=
 new SpeechSynthesisUtterance(text);

 utterance.lang="ja-JP";

 /* 보통 속도 */
 utterance.rate=0.82;

 utterance.pitch=1;
 utterance.volume=1;

 const japaneseVoices=
 voices.filter(v=>
  v.lang &&
  v.lang.toLowerCase().startsWith("ja")
 );

 const preferred=
 japaneseVoices.find(v=>
  /Google 日本語|Nanami|Kyoko|Otoya|Haruka|Japanese/i
  .test(v.name)
 ) || japaneseVoices[0];

 if(preferred)
  utterance.voice=preferred;

 speechSynthesis.speak(utterance);
}

function speakWord(){
 speakText(WORDS[idx][0]);
}

function speakQuiz(){
 if(quizWord)
  speakText(quizWord[0]);
}

render();
