<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7f8">
<title>유짱의 매일일본어</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:"Gowun Dodum",Arial,sans-serif;
 background:#fff7f8;
 color:#352f35
}

button,input,select{font-family:inherit}

.lock{
 position:fixed;
 inset:0;
 z-index:9999;
 background:linear-gradient(145deg,#fff 0%,#fff1f4 60%,#ffdce4 100%);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:24px
}

.lockbox{
 width:min(390px,100%);
 background:#fff;
 border:1px solid #f4dce2;
 border-radius:26px;
 padding:28px 22px;
 text-align:center;
 box-shadow:0 18px 45px #8c173022
}

.lockflower{font-size:45px}

.lockbox h2{
 margin:8px 0 5px;
 color:#bc002d
}

.lockbox p{
 font-size:14px;
 color:#76666b
}

.lockbox input{
 width:100%;
 padding:15px;
 border:1px solid #efd5dc;
 border-radius:14px;
 font-size:20px;
 text-align:center;
 letter-spacing:6px;
 margin:12px 0
}

.lockbox button{
 width:100%;
 border:0;
 border-radius:15px;
 padding:14px;
 background:#bc002d;
 color:#fff;
 font-size:16px;
 font-weight:900
}

.lockmsg{
 min-height:20px;
 color:#bc002d;
 font-size:13px;
 margin-top:9px
}

.app{
 max-width:560px;
 margin:auto;
 min-height:100vh;
 background:#fff
}

header{
 position:relative;
 overflow:hidden;
 padding:26px 18px 22px;
 background:linear-gradient(145deg,#fff 0%,#fff5f7 58%,#ffe5eb 100%);
 border-bottom:4px solid #bc002d;
 border-radius:0 0 30px 30px
}

header:before{
 content:"";
 position:absolute;
 width:108px;
 height:108px;
 border-radius:50%;
 background:#bc002d;
 right:-28px;
 top:-28px
}

header:after{
 content:"🌸";
 position:absolute;
 right:68px;
 bottom:7px;
 font-size:36px
}

.small{
 font-size:13px;
 color:#9a3850;
 font-weight:800
}

h1{
 font-size:27px;
 margin:6px 0
}

.sub{
 font-size:14px;
 color:#76666b
}

.tabs{
 display:flex;
 gap:7px;
 padding:12px;
 background:#fff;
 position:sticky;
 top:0;
 z-index:5
}

.tabs button{
 flex:1;
 border:0;
 border-radius:14px;
 padding:11px 6px;
 background:#fff0f3;
 color:#8d4052;
 font-weight:900
}

.tabs .on{
 background:#bc002d;
 color:#fff
}

main{
 padding:0 16px 30px
}

.hide{display:none}

.card{
 margin:14px 0;
 padding:17px;
 border:1px solid #f4dce2;
 border-radius:20px;
 background:#fff
}

.word{
 font-family:"Noto Sans JP",sans-serif;
 font-size:40px;
 font-weight:900;
 text-align:center;
 margin:10px 0 3px;
 color:#bc002d
}

.reading{
 font-family:"Noto Sans JP",sans-serif;
 text-align:center;
 font-size:20px;
 color:#74525c
}

.meaning{
 text-align:center;
 font-size:24px;
 font-weight:900;
 margin:18px 0
}

.tag{
 display:inline-block;
 padding:5px 10px;
 border-radius:99px;
 background:#fff0f3;
 color:#bc002d;
 font-size:12px;
 font-weight:900
}

.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:9px;
 margin-top:14px
}

.btn{
 border:0;
 border-radius:16px;
 padding:14px;
 font-size:16px;
 font-weight:900
}

.know{
 background:#bc002d;
 color:#fff
}

.again{
 background:#ffe3e9;
 color:#8f2942
}

.next{
 background:#f7a9bb;
 color:#5b1d2c;
 width:100%;
 margin-top:10px
}

.progress{
 height:10px;
 background:#f7e7eb;
 border-radius:99px;
 overflow:hidden;
 margin-top:9px
}

.bar{
 height:100%;
 background:#bc002d;
 width:0
}

.row{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center
}

.star{
 border:0;
 background:#fff;
 font-size:24px;
 color:#bc002d
}

.speak{
 border:0;
 background:#fff0f3;
 color:#bc002d;
 border-radius:999px;
 padding:9px 13px;
 font-size:14px;
 font-weight:900
}

.notice{
 font-size:12px;
 color:#7d6d72;
 background:#fff8da;
 border:1px solid #f4e7ae;
 padding:10px 12px;
 border-radius:12px;
 margin-top:10px
}
</style>
</head>

<body>

<div class="lock" id="lock">
 <div class="lockbox">
  <div class="lockflower">🌸</div>
  <h2>유짱의 매일일본어</h2>
  <p>비밀번호를 입력하면 단어장을 시작할 수 있어요.</p>

  <input id="passcode"
         type="password"
         inputmode="numeric"
         maxlength="4"
         placeholder="••••">

  <button id="unlockBtn">입장하기</button>

  <div class="lockmsg" id="lockmsg"></div>
 </div>
</div>

<div class="app">

<header>
 <div class="small">一日日本語 · JLPT N4</div>
 <h1>유짱의 매일일본어 🇯🇵</h1>
 <div class="sub">
  보고 · 외우고 · 퀴즈로 확인하는 N4 단어앱
 </div>
</header>

<div class="tabs">
 <button class="on" data-tab="study">학습</button>
 <button data-tab="quiz">퀴즈</button>
 <button data-tab="words">단어장</button>
 <button data-tab="progress">진도</button>
</div>

<main id="study">

<div class="card">

 <div class="row">
  <span class="tag" id="cat"></span>
  <button class="star" id="starBtn">☆</button>
 </div>

 <div class="word" id="w"></div>
 <div class="reading" id="r"></div>

 <div style="text-align:center;margin-top:10px">
  <button class="speak" id="speakWordBtn">
   🔊 발음 듣기
  </button>
 </div>

 <div class="meaning"
      id="m"
      style="visibility:hidden">
 </div>

 <button class="btn next" id="showMeaningBtn">
  뜻 보기
 </button>

 <div class="actions">
  <button class="btn again" id="againBtn">
   다시 볼래
  </button>

  <button class="btn know" id="knowBtn">
   외웠어요 ✓
  </button>
 </div>

 <div class="notice">
  카카오톡에서 발음이 나오지 않으면
  Chrome 또는 Safari로 열어주세요.
 </div>

</div>

<div class="card">
 <div class="row">
  <b>오늘 학습 진도</b>
  <span id="progText">0 / 0</span>
 </div>

 <div class="progress">
  <div class="bar" id="bar"></div>
 </div>
</div>

</main>
