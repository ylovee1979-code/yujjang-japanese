<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff7f8">
<title>유짱의 매일일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Gowun Dodum",sans-serif;background:#fff7f8;color:#352f35}
button,input,select{font-family:inherit}
.lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(145deg,#fff,#fff1f4 60%,#ffdce4);display:flex;align-items:center;justify-content:center;padding:24px}
.lockbox{width:min(390px,100%);background:#fff;border:1px solid #f4dce2;border-radius:26px;padding:28px 22px;text-align:center;box-shadow:0 18px 45px #8c173022}
.lockflower{font-size:45px}.lockbox h2{margin:8px 0 5px;color:#bc002d}.lockbox p{font-size:14px;color:#76666b}
.lockbox input{width:100%;padding:15px;border:1px solid #efd5dc;border-radius:14px;font-size:20px;text-align:center;letter-spacing:6px;margin:12px 0}
.lockbox button{width:100%;border:0;border-radius:15px;padding:14px;background:#bc002d;color:#fff;font-size:16px;font-weight:900}
.lockmsg{min-height:20px;color:#bc002d;font-size:13px;margin-top:9px}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}
header{position:relative;overflow:hidden;padding:26px 18px 22px;background:linear-gradient(145deg,#fff,#fff5f7 58%,#ffe5eb);border-bottom:4px solid #bc002d;border-radius:0 0 30px 30px}
header:before{content:"";position:absolute;width:108px;height:108px;border-radius:50%;background:#bc002d;right:-28px;top:-28px}
header:after{content:"🌸";position:absolute;right:68px;bottom:7px;font-size:36px}
.small{font-size:13px;color:#9a3850;font-weight:800}
h1{font-size:27px;margin:6px 0}.sub{font-size:14px;color:#76666b}
.tabs{display:flex;gap:7px;padding:12px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #f4dce2}
.tabs button{flex:1;border:0;border-radius:14px;padding:11px 6px;background:#fff0f3;color:#8d4052;font-weight:900}
.tabs .on{background:#bc002d;color:#fff}
main{padding:0 16px 30px}.hide{display:none}
.card{margin:14px 0;padding:17px;border:1px solid #f4dce2;border-radius:20px;box-shadow:0 8px 20px #9c23400d;background:#fff}
.word{font-family:"Noto Sans JP",sans-serif;font-size:40px;font-weight:900;text-align:center;margin:10px 0 3px;color:#bc002d}
.reading{font-family:"Noto Sans JP",sans-serif;text-align:center;font-size:20px;color:#74525c}
.meaning{text-align:center;font-size:24px;font-weight:900;margin:18px 0}
.tag{display:inline-block;padding:5px 10px;border-radius:99px;background:#fff0f3;color:#bc002d;font-size:12px;font-weight:900}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.btn{border:0;border-radius:16px;padding:14px;font-size:16px;font-weight:900}
.know{background:#bc002d;color:#fff}.again{background:#ffe3e9;color:#8f2942}
.next{background:#f7a9bb;color:#5b1d2c;width:100%;margin-top:10px}
.progress{height:10px;background:#f7e7eb;border-radius:99px;overflow:hidden;margin-top:9px}
.bar{height:100%;background:#bc002d;width:0}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.star{border:0;background:#fff;font-size:24px;color:#bc002d}
.speak{border:0;background:#fff0f3;color:#bc002d;border-radius:999px;padding:9px 13px;font-size:14px;font-weight:900}
.search{width:100%;padding:13px;border:1px solid #efd5dc;border-radius:14px;font-size:15px;margin:5px 0 10px}
.listitem{padding:13px 0;border-bottom:1px solid #f5e5e9}
.jp{font-family:"Noto Sans JP",sans-serif;font-size:21px;font-weight:900;color:#a70028}
.kr{font-size:14px;color:#75676c;margin-top:3px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:14px;border-radius:16px;text-align:center;background:#fff0f3}
.num{font-size:24px;font-weight:900;margin-top:5px;color:#bc002d}
.quizopt{width:100%;text-align:left;padding:13px;border:1px solid #efdce1;background:#fff;border-radius:13px;margin:7px 0;font-size:15px}
.correct{background:#e4f5e7!important}.wrong{background:#ffe1e7!important}
select{width:100%;padding:12px;border:1px solid #efd5dc;border-radius:13px;margin-bottom:10px}
.notice{font-size:12px;color:#7d6d72;background:#fff8da;border:1px solid #f4e7ae;padding:10px 12px;border-radius:12px;margin-top:10px;line-height:1.5}
</style>
</head>
<body>

<div class="lock" id="lock">
<div class="lockbox">
<div class="lockflower">🌸</div>
<h2>유짱의 매일일본어</h2>
<p>비밀번호를 입력하면 시작할 수 있어요.</p>
<input id="passcode" type="password" inputmode="numeric" maxlength="4" placeholder="••••">
<button id="unlockBtn">입장하기</button>
<div class="lockmsg" id="lockmsg"></div>
</div>
</div>

<div class="app">
<header>
<div class="small">一日日本語 · JLPT N4</div>
<h1>유짱의 매일일본어 🇯🇵</h1>
<div class="sub">보고 · 외우고 · 퀴즈로 확인하는 N4 단어앱</div>
</header>

<div class="tabs">
<button class="on" data-tab="study">학습</button>
<button data-tab="quiz">퀴즈</button>
<button data-tab="words">단어장</button>
<button data-tab="progress">진도</button>
</div>

<main id="study">
<div class="card">
<div class="row"><span class="tag" id="cat"></span><button class="star" id="starBtn">☆</button></div>
<div class="word" id="w"></div>
<div class="reading" id="r"></div>
<div style="text-align:center;margin-top:10px"><button class="speak" id="speakWordBtn">🔊 발음 듣기</button></div>
<div class="meaning" id="m" style="visibility:hidden"></div>
<button class="btn next" id="showMeaningBtn">뜻 보기</button>
<div class="actions">
<button class="btn again" id="againBtn">다시 볼래</button>
<button class="btn know" id="knowBtn">외웠어요 ✓</button>
</div>
<div class="notice">카카오톡에서 발음이 나오지 않으면 Chrome 또는 Safari로 열어주세요.</div>
</div>
<div class="card">
<div class="row"><b>학습 진도</b><span id="progText">0 / 0</span></div>
<div class="progress"><div class="bar" id="bar"></div></div>
</div>
</main>

<main id="quiz" class="hide">
<div class="card">
<div class="small">4지선다 퀴즈</div>
<div class="word" id="qw"></div>
<div class="reading" id="qr"></div>
<div style="text-align:center"><button class="speak" id="speakQuizBtn">🔊 발음 듣기</button></div>
<div id="opts"></div>
<div id="qmsg"></div>
<button class="btn next" id="nextQuizBtn">다음 문제</button>
</div>
</main>

<main id="words" class="hide">
<div class="card">
<input class="search" id="search" placeholder="단어, 읽기, 뜻 검색">
<select id="filter">
<option value="">전체</option>
<option>명사</option><option>동사</option><option>형용사</option>
<option>형용동사</option><option>부사</option>
</select>
<div id="list"></div>
</div>
</main>

<main id="progress" class="hide">
<div class="card">
<div class="statgrid">
<div class="stat">암기<div class="num" id="knownN">0</div></div>
<div class="stat">다시<div class="num" id="againN">0</div></div>
<div class="stat">즐겨찾기<div class="num" id="favN">0</div></div>
</div>
</div>
<div class="card">
<b>전체 암기율</b>
<div class="progress"><div class="bar" id="totalBar"></div></div>
<div id="totalText" class="small"></div>
</div>
</main>
</div>

const $=id=>document.getElementById(id);
let state=JSON.parse(localStorage.getItem("n4state")||'{"known":{},"again":{},"fav":{}}');
let idx=Number(localStorage.getItem("n4idx")||0)%WORDS.length;
let quizWord=null;

function unlockApp(){
 if($("passcode").value==="1234"){
  sessionStorage.setItem("yujjang_access","ok");
  $("lock").style.display="none";
 }else{
  $("lockmsg").textContent="비밀번호가 맞지 않아요.";
  $("passcode").value="";
 }
}

$("unlockBtn").onclick=unlockApp;
$("passcode").addEventListener("keydown",e=>{
 if(e.key==="Enter")unlockApp();
});

if(sessionStorage.getItem("yujjang_access")==="ok"){
 $("lock").style.display="none";
}

function save(){
 localStorage.setItem("n4state",JSON.stringify(state));
 localStorage.setItem("n4idx",idx);
}

function switchTab(id,b){
 document.querySelectorAll("main").forEach(x=>x.classList.add("hide"));
 $(id).classList.remove("hide");
 document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
 b.classList.add("on");
 if(id==="words")renderList();
 if(id==="progress")renderProgress();
 if(id==="quiz")newQuiz();
}

document.querySelectorAll(".tabs button").forEach(b=>{
 b.onclick=()=>switchTab(b.dataset.tab,b);
});

function render(){
 const x=WORDS[idx];
 $("w").textContent=x[0];
 $("r").textContent=x[1];
 $("m").textContent=x[2];
 $("m").style.visibility="hidden";
 $("cat").textContent=x[3];
 $("starBtn").textContent=state.fav[idx]?"★":"☆";
 updateProg();
}

$("showMeaningBtn").onclick=()=>$("m").style.visibility="visible";

function mark(ok){
 if(ok){
  state.known[idx]=1;
  delete state.again[idx];
 }else{
  state.again[idx]=1;
  delete state.known[idx];
 }
 idx=(idx+1)%WORDS.length;
 save();
 render();
}

$("knowBtn").onclick=()=>mark(true);
$("againBtn").onclick=()=>mark(false);

$("starBtn").onclick=()=>{
 state.fav[idx]?delete state.fav[idx]:state.fav[idx]=1;
 save();
 render();
};

function updateProg(){
 const n=Object.keys(state.known).length+Object.keys(state.again).length;
 $("progText").textContent=n+" / "+WORDS.length;
 $("bar").style.width=(n/WORDS.length*100)+"%";
}

function renderList(){
 const q=$("search").value.trim().toLowerCase();
 const f=$("filter").value;
 $("list").innerHTML="";

 WORDS.forEach((x,i)=>{
  if(f&&x[3]!==f)return;
  if(q&&!x.join(" ").toLowerCase().includes(q))return;

  const d=document.createElement("div");
  d.className="listitem";
  d.innerHTML=`
   <div class="row">
    <div>
     <div class="jp">${x[0]} <span class="small">${x[1]}</span></div>
     <div class="kr">${x[2]} · ${x[3]}</div>
    </div>
    <button class="speak">🔊</button>
   </div>`;

  d.querySelector("button").onclick=e=>{
   e.stopPropagation();
   speakJapanese(x[1]);
  };

  d.onclick=()=>{
   idx=i;
   save();
   document.querySelector('[data-tab="study"]').click();
   render();
  };

  $("list").appendChild(d);
 });
}

$("search").oninput=renderList;
$("filter").onchange=renderList;

function renderProgress(){
 const k=Object.keys(state.known).length;
 const a=Object.keys(state.again).length;
 const f=Object.keys(state.fav).length;

 $("knownN").textContent=k;
 $("againN").textContent=a;
 $("favN").textContent=f;

 const p=k/WORDS.length*100;
 $("totalBar").style.width=p+"%";
 $("totalText").textContent=`${WORDS.length}개 중 ${k}개 암기 · ${Math.round(p)}%`;
}

function newQuiz(){
 $("qmsg").textContent="";

 const qi=Math.floor(Math.random()*WORDS.length);
 quizWord=WORDS[qi];

 $("qw").textContent=quizWord[0];
 $("qr").textContent=quizWord[1];

 let pool=[quizWord[2]];

 while(pool.length<4){
  const mm=WORDS[Math.floor(Math.random()*WORDS.length)][2];
  if(!pool.includes(mm))pool.push(mm);
 }

 pool.sort(()=>Math.random()-.5);
 $("opts").innerHTML="";

 pool.forEach(v=>{
  const b=document.createElement("button");
  b.className="quizopt";
  b.textContent=v;

  b.onclick=()=>{
   document.querySelectorAll(".quizopt").forEach(z=>z.disabled=true);

   if(v===quizWord[2]){
    b.classList.add("correct");
    $("qmsg").textContent="정답! 🎉";
   }else{
    b.classList.add("wrong");
    $("qmsg").textContent="정답: "+quizWord[2];
   }
  };

  $("opts").appendChild(b);
 });
}

$("nextQuizBtn").onclick=newQuiz;

/* 일본어 음성 - 보통 속도 */
let voices=[];

function loadVoices(){
 if("speechSynthesis" in window){
  voices=window.speechSynthesis.getVoices();
 }
}

if("speechSynthesis" in window){
 loadVoices();
 window.speechSynthesis.onvoiceschanged=loadVoices;
}

function speakJapanese(text){

 if(!("speechSynthesis" in window)){
  alert("Chrome 또는 Safari에서 열어주세요.");
  return;
 }

 window.speechSynthesis.cancel();
 window.speechSynthesis.resume();

 const u=new SpeechSynthesisUtterance(text);

 u.lang="ja-JP";

 /* 보통 발음 속도 */
 u.rate=0.82;

 u.pitch=1;
 u.volume=1;

 const all=window.speechSynthesis.getVoices();

 const ja=all.filter(v=>
  v.lang&&v.lang.toLowerCase().startsWith("ja")
 );

 const preferred=
  ja.find(v=>
   /Google 日本語|Nanami|Kyoko|Otoya|Haruka|Japanese/i.test(v.name)
  )||ja[0];

 if(preferred)u.voice=preferred;

 window.speechSynthesis.speak(u);

 setTimeout(()=>{
  window.speechSynthesis.resume();
 },120);
}

/* 한자가 아니라 히라가나 읽기를 발음 */
$("speakWordBtn").onclick=()=>{
 speakJapanese(WORDS[idx][1]);
};

$("speakQuizBtn").onclick=()=>{
 if(quizWord)speakJapanese(quizWord[1]);
};

render();
</script>
